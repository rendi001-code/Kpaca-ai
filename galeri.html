<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galeri - KPACA AI</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="assets/style.css"></head><body class="bg-black p-4">
<script>if(!localStorage.getItem('kpaca_ai_login')) window.location='login.html';</script>
<h1 class="text-2xl font-bold text-[#00ff88] mb-6">Galeri - KPACA AI</h1>
<button onclick="generateImage()" class="btn-neon px-4 py-2 rounded-lg mb-4">/imagine Baru</button>
<div id="gallery" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>
<script>
function generateImage(){ 
  const prompt = prompt("Mau generate gambar apa?");
  const img = document.createElement('img');
  img.src = `https://placehold.co/400x400/00ff88/000?text=${prompt}`;
  img.className = "rounded-xl glass";
  gallery.appendChild(img);
}
const imgs = JSON.parse(localStorage.getItem('kpaca_ai_gallery')||'[]');
imgs.forEach(i => gallery.innerHTML += `<img src="${i}" class="rounded-xl glass">`);
</script></body></html>
