<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workspace - KPACA AI</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="assets/style.css"></head><body class="bg-black">
<script>if(!localStorage.getItem('kpaca_ai_login')) window.location='login.html';</script>
<div class="flex border-b border-[#00ff88]/20">
  <button onclick="showTab('chat')" class="tab-btn p-4">Chat</button>
  <button onclick="showTab('riset')" class="tab-btn p-4">Riset</button>
  <button onclick="showTab('kode')" class="tab-btn p-4">Kode</button>
  <button onclick="showTab('data')" class="tab-btn p-4">Data</button>
</div>
<div id="chat" class="tab p-4">Area Chat Workspace</div>
<div id="riset" class="tab p-4 hidden">Area Riset + Web Search</div>
<div id="kode" class="tab p-4 hidden">Area Kode</div>
<div id="data" class="tab p-4 hidden">Area Data + Upload File</div>
<script>
function showTab(id){ document.querySelectorAll('.tab').forEach(t=>t.classList.add('hidden')); document.getElementById(id).classList.remove('hidden'); }
</script></body></html>
