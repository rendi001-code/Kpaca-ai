<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Owner Panel - KPACA AI</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="assets/style.css"></head>
<body class="p-6"><a href="index.html" class="mb-4 block">← Kembali ke Chat</a>
<h1 class="text-2xl font-bold mb-6">Panel Owner</h1>
<div class="glass p-4 rounded-xl mb-4"><h3 class="font-bold mb-2">API Key OpenRouter</h3>
<input id="api_key" type="password" class="w-full p-2 bg-black/30 rounded border-[var(--border)] text-[var(--text)]">
<button id="save-key" class="btn-neon p-2 rounded mt-2">Update Key</button></div></body>
<script src="assets/config.js"></script><script>
document.getElementById('api_key').value = CONFIG.default_api_key;
document.getElementById('save-key').onclick = () => { localStorage.setItem('api_key', document.getElementById('api_key').value); alert('API Key tersimpan! Refresh') }
</script></html>
