<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Owner Panel - KPACA AI</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="assets/style.css"></head>
<body class="p-6"><a href="chat.html" class="text-[var(--neon)] mb-4 block">← Kembali ke Chat</a>
<h1 class="text-2xl font-bold text-[var(--neon)] mb-6">Panel Owner</h1>
<div class="glass p-4 rounded-xl mb-4"><h3 class="font-bold mb-2">API Key OpenRouter</h3>
<input id="api_key" type="password" class="w-full p-2 bg-black/30 rounded border-[var(--border)] text-[var(--text)]">
<button id="save-key" class="btn-neon p-2 rounded mt-2">Update Key</button></div>
<div class="glass p-4 rounded-xl"><h3 class="font-bold mb-2">Maintenance Mode</h3>
<label class="flex items-center gap-2"><input type="checkbox" id="maint-toggle"> Aktifkan Maintenance</label></div></body>
<script src="assets/config.js"></script><script type="module">
import { getUser, supabase, getTheme } from './assets/supabase.js'; import { checkAuth } from './assets/auth.js';
await checkAuth(); const user = await getUser(); const t = await getTheme(user.id); if(t==='light') document.body.classList.add('light');
api_key.value = CONFIG.default_api_key; maint-toggle.checked = CONFIG.maintenance_mode;
save-key.onclick = async () => { localStorage.setItem('kpaca_ai_api_key', btoa(api_key.value)); await supabase.from('profiles').update({api_key: btoa(api_key.value)}).eq('id', user.id); alert('API Key tersimpan!') }
maint-toggle.onchange = () => { localStorage.setItem('kpaca_maint', maint-toggle.checked); alert('Refresh untuk aktif') }
</script></html>
