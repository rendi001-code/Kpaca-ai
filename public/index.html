<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KPACA AI - Chat Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/style.css">
</head>
<body>

<!-- History Panel -->
<div id="historyPanel" class="history-panel">
    <div class="flex justify-between items-center mb-6">
        <h2 class="text-lg font-bold text-white">Riwayat Chat</h2>
        <button onclick="closeHistory()" class="text-gray-400 hover:text-white">
            <i class="fas fa-times"></i>
        </button>
    </div>
    <div class="relative mb-4">
        <i class="fas fa-search absolute left-3 top-3 text-gray-500"></i>
        <input 
            type="text" 
            id="searchHistory" 
            placeholder="Cari riwayat..." 
            class="w-full bg-[#0a0a0a] text-white rounded-full py-2 pl-10 pr-4 border border-[#2a2a2a] outline-none focus:border-purple-500"
            oninput="filterHistory(this.value)"
        >
    </div>
    <div id="historyList"></div>
</div>

<!-- Main Container -->
<div class="flex flex-col h-screen max-w-4xl mx-auto p-4 md:p-6">
    <!-- Header -->
    <header class="flex justify-between items-center mb-4">
        <div class="flex items-center gap-3">
            <button onclick="toggleHistory()" class="text-gray-400 hover:text-white">
                <i class="fas fa-bars text-xl"></i>
            </button>
            <h1 class="text-2xl font-bold bg-gradient-to-r from-purple-500 to-pink-500 bg-clip-text text-transparent">
                KPACA AI
            </h1>
        </div>
        <div class="flex items-center gap-3">
            <button onclick="newChat()" class="text-gray-400 hover:text-white" title="Chat Baru">
                <i class="fas fa-plus text-xl"></i>
            </button>
            <a href="/profile.html" class="text-gray-400 hover:text-white">
                <i class="fas fa-user-circle text-2xl"></i>
            </a>
        </div>
    </header>

    <!-- AI Mode Selector -->
    <div class="flex gap-2 mb-4 overflow-x-auto pb-2 scrollbar-hide">
        <button data-mode="default" class="mode-btn active" onclick="setMode('default', this)">Default</button>
        <button data-mode="programmer" class="mode-btn" onclick="setMode('programmer', this)">Programmer</button>
        <button data-mode="guru" class="mode-btn" onclick="setMode('guru', this)">Guru</button>
        <button data-mode="kreatif" class="mode-btn" onclick="setMode('kreatif', this)">Kreatif</button>
    </div>

    <!-- Chat Area -->
    <div id="chatArea" class="flex-1 overflow-y-auto mb-4 space-y-3 p-2">
        <div class="chat-bubble-ai">
            <p class="text-sm text-gray-300">👋 Halo! Saya KPACA AI. Ada yang bisa saya bantu?</p>
        </div>
    </div>

    <!-- Input Bar -->
    <div class="relative">
        <div class="input-bar">
            <button onclick="openCamera()" title="Kamera">
                <i class="fas fa-camera"></i>
            </button>
            <input 
                type="text" 
                id="messageInput" 
                placeholder="Tulis pesan..." 
                onkeydown="if(event.key==='Enter') sendMessage()"
            >
            <button onclick="toggleMenu()" id="plusButton" title="Tambah">
                <i class="fas fa-plus-circle text-2xl text-purple-500"></i>
            </button>
            <button onclick="startVoice()" title="Suara">
                <i class="fas fa-microphone"></i>
            </button>
            <button onclick="sendMessage()" class="btn-gradient text-white px-4 py-1 rounded-full text-sm font-medium">
                Kirim
            </button>
        </div>

        <!-- Menu Dropdown -->
        <div id="menuDropdown" class="menu-dropdown">
            <button onclick="uploadFile()">
                <i class="fas fa-upload"></i> Upload File
            </button>
            <button onclick="showGenerateImage()">
                <i class="fas fa-image"></i> Generate Image
            </button>
        </div>
    </div>
</div>

<!-- Modal Generate Image -->
<div id="imageModal" class="modal-overlay">
    <div class="modal-content">
        <h3 class="text-xl font-bold mb-4 text-white">Generate Gambar AI</h3>
        <p class="text-gray-400 text-sm mb-4">Deskripsikan gambar yang ingin Anda buat.</p>
        <textarea 
            id="imagePrompt" 
            rows="3" 
            class="w-full bg-[#0a0a0a] text-white rounded-xl p-3 border border-[#2a2a2a] outline-none focus:border-purple-500 resize-none"
            placeholder="Contoh: Sebuah kucing astronaut di bulan..."
        ></textarea>
        <div class="flex gap-3 mt-4">
            <button onclick="hideModal('imageModal')" class="flex-1 bg-[#2a2a2a] text-white py-2 rounded-xl hover:bg-[#3a3a3a]">
                Batal
            </button>
            <button onclick="generateImage()" class="flex-1 btn-gradient text-white py-2 rounded-xl font-medium">
                <i class="fas fa-wand-magic-sparkles mr-2"></i> Generate
            </button>
        </div>
    </div>
</div>

<!-- Loading Indicator -->
<div id="loadingIndicator" class="chat-bubble-ai" style="display:none;">
    <div class="typing-dots">
        <span></span>
        <span></span>
        <span></span>
    </div>
</div>

<script>
// ===== CHECK AUTH =====
const token = localStorage.getItem('token');
if (!token) {
    window.location.href = '/login.html';
}

// ===== GLOBAL VARIABLES =====
let currentMode = 'default';
let currentSessionId = null;
let currentUserId = null;

// ===== LOAD USER DATA =====
function loadUserData() {
    const userData = localStorage.getItem('user');
    if (userData) {
        try {
            const user = JSON.parse(userData);
            currentUserId = user.id;
        } catch (e) {
            console.error('Error parsing user data:', e);
        }
    }
}
loadUserData();

// ===== API CALL =====
async function apiCall(endpoint, options = {}) {
    const token = localStorage.getItem('token');
    const headers = {
        'Content-Type': 'application/json',
        ...options.headers
    };
    
    if (token) {
        headers['Authorization'] = `Bearer ${token}`;
    }
    
    const response = await fetch(endpoint, {
        ...options,
        headers
    });
    
    const data = await response.json();
    
    if (!response.ok) {
        if (response.status === 401 || response.status === 403) {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = '/login.html';
        }
        throw new Error(data.error || 'Request failed');
    }
    
    return data;
}

// ===== INIT =====
document.addEventListener('DOMContentLoaded', async () => {
    await loadSessions();
    await createNewSession();
});

// ===== LOAD SESSIONS =====
async function loadSessions() {
    try {
        const data = await apiCall('/api/sessions');
        renderHistory(data.sessions);
    } catch (error) {
        console.error('Error loading sessions:', error);
    }
}

// ===== RENDER HISTORY =====
function renderHistory(sessions) {
    const container = document.getElementById('historyList');
    if (!sessions || sessions.length === 0) {
        container.innerHTML = `
            <div class="text-center text-gray-500 py-8">
                <i class="fas fa-comment-slash text-3xl mb-2"></i>
                <p>Belum ada riwayat chat</p>
            </div>
        `;
        return;
    }

    container.innerHTML = sessions.map(session => `
        <div class="history-item ${session.is_active ? 'active' : ''}" 
             onclick="switchSession('${session.id}')">
            <div class="flex justify-between items-start">
                <div>
                    <p class="text-sm font-medium truncate">${escapeHtml(session.title)}</p>
                    <p class="text-xs text-gray-500">${formatDate(session.created_at)}</p>
                </div>
                ${session.is_active ? '<span class="text-xs text-purple-500">● Aktif</span>' : ''}
            </div>
        </div>
    `).join('');
}

// ===== FILTER HISTORY =====
function filterHistory(query) {
    const items = document.querySelectorAll('.history-item');
    items.forEach(item => {
        const text = item.textContent.toLowerCase();
        item.style.display = text.includes(query.toLowerCase()) ? '' : 'none';
    });
}

// ===== TOGGLE HISTORY =====
function toggleHistory() {
    document.getElementById('historyPanel').classList.toggle('open');
}

function closeHistory() {
    document.getElementById('historyPanel').classList.remove('open');
}

// ===== SWITCH SESSION =====
async function switchSession(sessionId) {
    try {
        const data = await apiCall(`/api/chats/${sessionId}`);
        currentSessionId = sessionId;
        
        const chatArea = document.getElementById('chatArea');
        chatArea.innerHTML = '';
        
        data.chats.forEach(chat => {
            if (chat.role === 'user') {
                addUserMessage(chat.content);
            } else if (chat.role === 'assistant') {
                addAIMessage(chat.content);
            } else if (chat.role === 'assistant_image') {
                addImageMessage(chat.content);
            }
        });

        await loadSessions();
        closeHistory();
    } catch (error) {
        console.error('Error switching session:', error);
        showToast('Gagal切换 sesi', 'error');
    }
}

// ===== CREATE NEW SESSION =====
async function createNewSession() {
    try {
        const data = await apiCall('/api/sessions', {
            method: 'POST',
            body: JSON.stringify({ title: 'Chat Baru' })
        });
        
        currentSessionId = data.session.id;
        
        const chatArea = document.getElementById('chatArea');
        chatArea.innerHTML = `
            <div class="chat-bubble-ai">
                <p class="text-sm text-gray-300">👋 Halo! Saya KPACA AI. Ada yang bisa saya bantu?</p>
            </div>
        `;
        
        await loadSessions();
    } catch (error) {
        console.error('Error creating session:', error);
    }
}

function newChat() {
    createNewSession();
    showToast('Chat baru dibuat!', 'success');
}

// ===== SET MODE =====
function setMode(mode, button) {
    currentMode = mode;
    document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
    button.classList.add('active');
    showToast(`Mode ${mode.charAt(0).toUpperCase() + mode.slice(1)} aktif`, 'info');
}

// ===== SEND MESSAGE =====
async function sendMessage() {
    const input = document.getElementById('messageInput');
    const message = input.value.trim();

    if (!message || !currentSessionId) {
        if (!currentSessionId) {
            await createNewSession();
        }
        return;
    }

    addUserMessage(message);
    input.value = '';
    showLoading();

    try {
        const data = await apiCall('/api/chat', {
            method: 'POST',
            body: JSON.stringify({
                session_id: currentSessionId,
                message: message,
                mode: currentMode
            })
        });

        hideLoading();
        typeWriterText(data.response);
        await loadSessions();
    } catch (error) {
        hideLoading();
        console.error('Send message error:', error);
        addAIMessage('❌ Error: ' + error.message);
    }
}

// ===== ADD USER MESSAGE =====
function addUserMessage(text) {
    const chatArea = document.getElementById('chatArea');
    const div = document.createElement('div');
    div.className = 'chat-bubble-user';
    div.innerHTML = `<p class="text-sm text-white">${escapeHtml(text)}</p>`;
    chatArea.appendChild(div);
    scrollToBottom();
}

// ===== ADD AI MESSAGE =====
function addAIMessage(text) {
    const chatArea = document.getElementById('chatArea');
    const div = document.createElement('div');
    div.className = 'chat-bubble-ai';
    const p = document.createElement('p');
    p.className = 'text-sm text-gray-200';
    div.appendChild(p);
    chatArea.appendChild(div);
    scrollToBottom();
    typeWriter(p, text, 20);
}

// ===== TYPEWRITER EFFECT =====
function typeWriterText(text) {
    const chatArea = document.getElementById('chatArea');
    const div = document.createElement('div');
    div.className = 'chat-bubble-ai';
    const p = document.createElement('p');
    p.className = 'text-sm text-gray-200';
    div.appendChild(p);
    chatArea.appendChild(div);
    scrollToBottom();
    typeWriter(p, text, 20);
}

function typeWriter(element, text, speed = 20) {
    let index = 0;
    element.textContent = '';
    
    function type() {
        if (index < text.length) {
            element.textContent += text.charAt(index);
            index++;
            scrollToBottom();
            setTimeout(type, speed);
        }
    }
    
    type();
}

// ===== ADD IMAGE MESSAGE =====
function addImageMessage(url) {
    const chatArea = document.getElementById('chatArea');
    const div = document.createElement('div');
    div.className = 'chat-bubble-image';
    div.innerHTML = `
        <img src="${url}" alt="Generated Image" 
             onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22200%22%3E%3Crect fill=%22%231a1a1a%22 width=%22200%22 height=%22200%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 dy=%22.3em%22 fill=%22%23666%22 font-size=%2214%22%3EGagal load gambar%3C/text%3E%3C/svg%3E'"
             class="rounded-xl max-w-full max-h-[400px] object-contain">
        <p class="text-xs text-gray-500 mt-2 text-center">🖼️ Gambar dihasilkan oleh AI</p>
    `;
    chatArea.appendChild(div);
    scrollToBottom();
}

// ===== SHOW/HIDE LOADING =====
function showLoading() {
    document.getElementById('loadingIndicator').style.display = 'block';
    scrollToBottom();
}

function hideLoading() {
    document.getElementById('loadingIndicator').style.display = 'none';
}

// ===== GENERATE IMAGE =====
function showGenerateImage() {
    closeMenu();
    document.getElementById('imageModal').classList.add('show');
    document.getElementById('imagePrompt').value = '';
    document.getElementById('imagePrompt').focus();
}

async function generateImage() {
    const prompt = document.getElementById('imagePrompt').value.trim();
    
    if (!prompt) {
        showToast('Masukkan deskripsi gambar!', 'error');
        return;
    }

    if (!currentSessionId) {
        await createNewSession();
    }

    document.getElementById('imageModal').classList.remove('show');
    addUserMessage('🎨 Generate gambar: ' + prompt);
    showLoading();

    try {
        const data = await apiCall('/api/generate', {
            method: 'POST',
            body: JSON.stringify({
                session_id: currentSessionId,
                prompt: prompt
            })
        });

        hideLoading();
        addImageMessage(data.image_url);
        await loadSessions();
        showToast('✅ Gambar berhasil digenerate!', 'success');
    } catch (error) {
        hideLoading();
        console.error('Generate image error:', error);
        addAIMessage('❌ Gagal generate gambar: ' + error.message);
    }
}

// ===== UPLOAD FILE =====
function uploadFile() {
    closeMenu();
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*,.pdf,.doc,.docx,.txt';
    input.onchange = function(e) {
        const file = e.target.files[0];
        if (file) {
            addUserMessage('📎 Upload file: ' + file.name);
            addAIMessage('📁 File "' + file.name + '" berhasil diupload. (Ukuran: ' + 
                (file.size / 1024).toFixed(1) + ' KB)\n\nFitur preview file akan segera hadir!');
        }
    };
    input.click();
}

// ===== VOICE INPUT =====
function startVoice() {
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();
        recognition.lang = 'id-ID';
        recognition.continuous = false;
        recognition.interimResults = false;
        
        recognition.onresult = function(event) {
            const transcript = event.results[0][0].transcript;
            document.getElementById('messageInput').value = transcript;
            sendMessage();
        };
        
        recognition.onerror = function(event) {
            console.error('Speech error:', event.error);
            showToast('Maaf, mikrofon tidak dapat diakses.', 'error');
        };
        
        recognition.start();
        showToast('🎤 Dengarkan...', 'info');
    } else {
        showToast('Browser Anda tidak mendukung voice input.', 'error');
    }
}

// ===== CAMERA =====
function openCamera() {
    if ('mediaDevices' in navigator && 'getUserMedia' in navigator.mediaDevices) {
        navigator.mediaDevices.getUserMedia({ video: true })
            .then(function(stream) {
                addUserMessage('📸 Foto diambil dari kamera');
                addAIMessage('📷 Gambar dari kamera berhasil diambil!');
                stream.getTracks().forEach(track => track.stop());
                showToast('✅ Foto berhasil diambil!', 'success');
            })
            .catch(function(error) {
                console.error('Camera error:', error);
                showToast('Tidak dapat mengakses kamera.', 'error');
            });
    } else {
        showToast('Browser Anda tidak mendukung akses kamera.', 'error');
    }
}

// ===== MENU =====
function toggleMenu() {
    const menu = document.getElementById('menuDropdown');
    menu.classList.toggle('show');
}

function closeMenu() {
    document.getElementById('menuDropdown').classList.remove('show');
}

// ===== SCROLL =====
function scrollToBottom() {
    const chatArea = document.getElementById('chatArea');
    chatArea.scrollTop = chatArea.scrollHeight;
}

// ===== UTILITY FUNCTIONS =====
function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function formatDate(dateStr) {
    const date = new Date(dateStr);
    return date.toLocaleDateString('id-ID', {
        day: 'numeric',
        month: 'short',
        year: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
    });
}

function showToast(message, type = 'info') {
    const colors = {
        success: '#22c55e',
        error: '#ef4444',
        info: '#8b5cf6'
    };
    
    const toast = document.createElement('div');
    toast.className = 'toast-container';
    toast.style.borderColor = colors[type];
    toast.textContent = message;
    document.body.appendChild(toast);
    
    setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.3s';
        setTimeout(() => toast.remove(), 300);
    }, 3000);
}

function hideModal(modalId) {
    document.getElementById(modalId).classList.remove('show');
}

// ===== CLOSE MENU ON OUTSIDE CLICK =====
document.addEventListener('click', function(e) {
    const menu = document.getElementById('menuDropdown');
    const plusButton = document.getElementById('plusButton');
    if (menu && !menu.contains(e.target) && !plusButton.contains(e.target)) {
        menu.classList.remove('show');
    }
});

// ===== CLOSE MODAL ON OVERLAY CLICK =====
document.querySelectorAll('.modal-overlay').forEach(modal => {
    modal.addEventListener('click', function(e) {
        if (e.target === this) {
            this.classList.remove('show');
        }
    });
});

// ===== KEYBOARD SHORTCUTS =====
document.addEventListener('keydown', function(e) {
    if (e.ctrlKey && e.key === 'Enter') {
        e.preventDefault();
        sendMessage();
    }
    if (e.key === 'Escape') {
        closeMenu();
        document.querySelectorAll('.modal-overlay.show').forEach(m => m.classList.remove('show'));
        closeHistory();
    }
});

// ===== LOGOUT =====
function logout() {
    if (confirm('Yakin ingin keluar?')) {
        localStorage.removeItem('token');
        localStorage.removeItem('user');
        window.location.href = '/login.html';
    }
}

// ===== EXPOSE FUNCTIONS TO GLOBAL =====
window.sendMessage = sendMessage;
window.setMode = setMode;
window.newChat = newChat;
window.toggleHistory = toggleHistory;
window.closeHistory = closeHistory;
window.filterHistory = filterHistory;
window.switchSession = switchSession;
window.showGenerateImage = showGenerateImage;
window.generateImage = generateImage;
window.uploadFile = uploadFile;
window.startVoice = startVoice;
window.openCamera = openCamera;
window.toggleMenu = toggleMenu;
window.closeMenu = closeMenu;
window.hideModal = hideModal;
window.logout = logout;
</script>
</body>
          </html>
