<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat - KPACA AI</title><script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/lucide@latest"></script>
<link rel="stylesheet" href="assets/style.css"></head><body class="flex h-screen">
<aside class="w-64 glass border-r border-[var(--border)] p-3 hidden md:flex flex-col">
<h2 class="font-bold text-[var(--neon)] mb-4">KPACA AI</h2><button onclick="newChat()" class="btn-neon w-full p-2 rounded-lg mb-4">+ Chat Baru</button>
<div id="chat-list" class="flex-1 overflow-y-auto space-y-1"></div></aside>
<div class="flex-1 flex-col">
<header class="glass p-3 flex items-center justify-between border-b border-[var(--border)]">
<input id="chat-title" value="Chat Baru" class="bg-transparent outline-none font-bold text-[var(--neon)] text-lg">
<div class="flex items-center gap-2">
<select id="lang-select" class="bg-black/50 border-[var(--border)] rounded-lg p-2 text-sm w-40"></select>
<select id="model-select" class="bg-black/50 border-[var(--border)] rounded-lg p-2 text-sm"></select>
<button id="btn-theme" class="p-2 glass rounded-lg"><i data-lucide="sun-moon"></i></button><button id="btn-menu" class="p-2 glass rounded-lg"><i data-lucide="ellipsis-vertical"></i></button></div></header>
<div id="menu-dropdown" class="hidden absolute right-3 top-14 w-56 glass rounded-2xl p-2 shadow-2xl z-50">
<button onclick="window.location='owner.html'" class="menu-item w-full"><i data-lucide="shield"></i> Owner Panel</button>
<button onclick="logout()" class="menu-item w-full text-red-400"><i data-lucide="log-out"></i> Logout</button></div>
<main id="chat-area" class="flex-1 overflow-y-auto p-4 pb-32"><div id="welcome" class="text-center mt-20"><h2 class="text-2xl font-bold">Apa yang bisa KPACA AI bantu?</h2></div></main>
<div class="p-4"><div class="glass rounded-full p-2 flex items-center gap-2 max-w-3xl mx-auto">
<label class="p-2 cursor-pointer"><i data-lucide="camera"></i><input id="file-upload" type="file" accept="image/*" class="hidden"></label>
<input id="prompt" placeholder="Tanya KPACA AI..." class="flex-1 bg-transparent outline-none">
<button class="p-2"><i data-lucide="mic"></i></button><button id="btn-plus" class="p-2"><i data-lucide="plus"></i></button>
<button id="btn-send" class="btn-neon p-2 rounded-full"><i data-lucide="send"></i></button></div></div></div>
<script src="assets/config.js"></script><script type="module">
import { checkAuth, getUser, getTheme, saveTheme, saveLang, getLang, createChat, saveMessage, getChats, getMessages, uploadImage, supabase, logout } from './assets/supabase.js';
import { callOpenRouter } from './assets/ai.js'; import { addMessage, showLoading } from './assets/chat-ui.js';
lucide.createIcons(); await checkAuth(); const user = await getUser(); const t = await getTheme(user.id); if(t==='light') document.body.classList.add('light');

CONFIG.default_models.forEach(m => model-select.innerHTML += `<option>${m}</option>`)
Object.keys(CONFIG.languages).forEach(k => lang-select.innerHTML += `<option value="${k}">${CONFIG.languages[k]}</option>`)
const userLang = await getLang(user.id); lang-select.value = userLang; lang-select.onchange = () => saveLang(user.id, lang-select.value);

btn-theme.onclick = () => { const newTheme = document.body.classList.contains('light')? 'dark' : 'light'; document.body.classList.toggle('light'); saveTheme(user.id, newTheme); }
let currentChat = null;
async function loadChats(){ const chats = await getChats(user.id); chat-list.innerHTML = chats.map(c => `<button onclick="loadChat('${c.id}')" class="w-full text-left p-2 rounded-lg hover:bg-[var(--neon)]/10 text-sm truncate">${c.title}</button>`).join('') }
async function newChat(){ currentChat = await createChat(user.id, 'Chat Baru'); chat-title.value = 'Chat Baru'; chat-area.innerHTML = '<div id="welcome" class="text-center mt-20"><h2 class="text-2xl font-bold">Apa yang bisa KPACA AI bantu?</h2></div>'; loadChats(); }
async function loadChat(id){ currentChat = {id}; const msgs = await getMessages(id); chat-area.innerHTML=''; msgs.forEach(m => addMessage(m.role, m.content)); }
window.newChat = newChat; window.loadChat = loadChat;

btn-send.onclick = async () => { const p = prompt.value; if(!p) return; if(!currentChat) await newChat();
const selectedLang = lang-select.value; const langInstruction = selectedLang === 'auto'? `Jawab dengan bahasa yang sama dengan pertanyaan user.` : `WAJIB jawab dalam bahasa: ${CONFIG.languages[selectedLang]}`;
addMessage('user', p); await saveMessage(currentChat.id, 'user', p); prompt.value=''; showLoading();
const res = await callOpenRouter(`${langInstruction}\n\nPertanyaan: ${p}`); const aiReply = res.choices[0].message.content; document.querySelector('#chat-area div:last-child').remove();
addMessage('assistant', aiReply); await saveMessage(currentChat.id, 'assistant', aiReply); }

file-upload.onchange = async (e) => { const file = e.target.files[0]; if(!file) return; const url = await uploadImage(file, user.id);
await supabase.from('images').insert([{user_id: user.id, chat_id: currentChat.id, url}]); addMessage('user', `<img src="${url}" class="rounded-xl max-w-xs">`);
await saveMessage(currentChat.id, 'user', `[Gambar]: ${url}`); showLoading(); const res = await callOpenRouter(`Jelaskan gambar ini: ${url}`);
const aiReply = res.choices[0].message.content; document.querySelector('#chat-area div:last-child').remove(); addMessage('assistant', aiReply); await saveMessage(currentChat.id, 'assistant', aiReply); }

btn-menu.onclick = () => menu-dropdown.classList.toggle('hidden');
window.logout = async () => { await logout(); window.location='login.html' }; loadChats();

const savedPrompt = localStorage.getItem('kpaca_ai_prompt'); if(savedPrompt){ prompt.value = savedPrompt; btn-send.click(); localStorage.removeItem('kpaca_ai_prompt'); }
</script></body></html>
