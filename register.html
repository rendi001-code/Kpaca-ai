<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daftar - KPACA AI</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="assets/style.css"></head>
<body class="h-screen flex items-center justify-center"><div class="glass rounded-2xl p-8 w-96">
<h1 class="text-3xl font-bold text-center mb-2 text-[var(--neon)]">Buat Akun</h1>
<form id="regForm"><input id="name" placeholder="Nama" required class="w-full p-3 mb-4 rounded-lg bg-black/30 border-[var(--border)] text-[var(--text)]">
<input id="email" type="email" placeholder="Email" required class="w-full p-3 mb-4 rounded-lg bg-black/30 border-[var(--border)] text-[var(--text)]">
<input id="password" type="password" placeholder="Password" required class="w-full p-3 mb-4 rounded-lg bg-black/30 border-[var(--border)] text-[var(--text)]">
<input id="cpass" type="password" placeholder="Konfirmasi Password" required class="w-full p-3 mb-6 rounded-lg bg-black/30 border-[var(--border)] text-[var(--text)]">
<button class="btn-neon w-full p-3 rounded-lg">Daftar</button></form>
<p class="text-center mt-4 text-sm" style="color:var(--text-2)">Sudah punya akun? <a href="login.html" class="text-[var(--neon)]">Login</a></p></div>
<script src="assets/config.js"></script><script type="module">
import { signup } from './assets/supabase.js';
document.getElementById('regForm').onsubmit = async (e) => { e.preventDefault(); if(password.value!== cpass.value) return alert('Password tidak sama');
try{ await signup(name.value, email.value, password.value); alert('Akun berhasil dibuat!'); window.location = 'login.html'; }catch(err){ alert(err.message) } }
</script></body></html>
