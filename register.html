<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daftar - KPACA AI</title><script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/lucide@latest"></script>
<link rel="stylesheet" href="assets/style.css"></head>
<body class="h-screen flex items-center justify-center p-4"><div class="glass rounded-2xl p-8 w-full max-w-sm">
<h1 class="text-3xl font-bold text-center mb-2">Buat Akun</h1><p style="color:var(--text-2)" class="text-center mb-6">Daftar ke KPACA AI</p>
<button id="btn-github-reg" class="w-full p-3 mb-4 rounded-lg glass border border-[var(--border)] flex items-center justify-center gap-3 hover:border-[var(--neon)]">
<svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0.319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg> Daftar dengan GitHub</button>
<div class="flex items-center gap-2 mb-4" style="color:var(--text-2)"><div class="h-px bg-[var(--border)] flex-1"></div>ATAU<div class="h-px bg-[var(--border)] flex-1"></div></div>
<form id="regForm"><input id="name" placeholder="Nama" required class="w-full p-3 mb-4 rounded-lg bg-black/30 border-[var(--border)] text-[var(--text)]">
<input id="email" type="email" placeholder="Email" required class="w-full p-3 mb-4 rounded-lg bg-black/30 border-[var(--border)] text-[var(--text)]">
<input id="password" type="password" placeholder="Password min 6" required class="w-full p-3 mb-4 rounded-lg bg-black/30 border-[var(--border)] text-[var(--text)]">
<input id="cpass" type="password" placeholder="Konfirmasi Password" required class="w-full p-3 mb-6 rounded-lg bg-black/30 border-[var(--border)] text-[var(--text)]">
<button class="btn-neon w-full p-3 rounded-lg">Daftar</button></form>
<p class="text-center mt-4 text-sm" style="color:var(--text-2)">Sudah punya akun? <a href="login.html" class="font-semibold">Login</a></p></div>
<script src="assets/config.js"></script>
<script type="module">
import { signup, supabase } from './assets/supabase.js'; lucide.createIcons();
document.getElementById('btn-github-reg').onclick = async () => { await supabase.auth.signInWithOAuth({ provider: 'github', options: { redirectTo: window.location.origin + '/index.html' } }) }
document.getElementById('regForm').onsubmit = async (e) => { e.preventDefault(); if(document.getElementById('password').value!== document.getElementById('cpass').value) return alert('Password tidak sama!');
try{ await signup(document.getElementById('name').value, document.getElementById('email').value, document.getElementById('password').value); alert('Akun berhasil dibuat!'); window.location = 'login.html'; }catch(err){ alert(err.message) } }
</script></body></html>
