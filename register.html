<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daftar - KPACA AI</title><script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/lucide@latest"></script>
<link rel="stylesheet" href="assets/style.css"></head>
<body class="h-screen flex items-center justify-center"><div class="glass rounded-2xl p-8 w-96">
<h1 class="text-3xl font-bold text-center mb-2 text-[var(--neon)]">Buat Akun</h1>
<p style="color:var(--text-2)" class="text-center mb-6">Daftar ke KPACA AI</p>

<button id="btn-github-reg" class="w-full p-3 mb-4 rounded-lg glass border-[var(--border)] flex items-center justify-center gap-2 hover:border-[var(--neon)] transition">
  <i data-lucide="github"></i> Daftar dengan GitHub
</button>

<div class="flex items-center gap-2 mb-4" style="color:var(--text-2)">
  <div class="h-px bg-[var(--border)] flex-1"></div>
  ATAU
  <div class="h-px bg-[var(--border)] flex-1"></div>
</div>

<form id="regForm">
  <input id="name" placeholder="Nama" required class="w-full p-3 mb-4 rounded-lg bg-black/30 border border-[var(--border)] text-[var(--text)] outline-none focus:border-[var(--neon)]">
  <input id="email" type="email" placeholder="Email" required class="w-full p-3 mb-4 rounded-lg bg-black/30 border-[var(--border)] text-[var(--text)] outline-none focus:border-[var(--neon)]">
  <input id="password" type="password" placeholder="Password" required class="w-full p-3 mb-4 rounded-lg bg-black/30 border border-[var(--border)] text-[var(--text)] outline-none focus:border-[var(--neon)]">
  <input id="cpass" type="password" placeholder="Konfirmasi Password" required class="w-full p-3 mb-6 rounded-lg bg-black/30 border border-[var(--border)] text-[var(--text)] outline-none focus:border-[var(--neon)]">
  <button class="btn-neon w-full p-3 rounded-lg">Daftar</button>
</form>

<p class="text-center mt-4 text-sm" style="color:var(--text-2)">
  Sudah punya akun? <a href="login.html" class="text-[var(--neon)] font-semibold">Login</a>
</p>
</div>

<script src="assets/config.js"></script>
<script type="module">
import { signup, supabase } from './assets/supabase.js';
lucide.createIcons();

// DAFTAR PAKE GITHUB
document.getElementById('btn-github-reg').onclick = async () => { 
  await supabase.auth.signInWithOAuth({ 
    provider: 'github', 
    options: { redirectTo: window.location.origin + '/index.html' } 
  }) 
}

// DAFTAR MANUAL
document.getElementById('regForm').onsubmit = async (e) => { 
  e.preventDefault(); 
  if(document.getElementById('password').value !== document.getElementById('cpass').value) 
    return alert('Password tidak sama!');
  try{ 
    await signup(
      document.getElementById('name').value, 
      document.getElementById('email').value, 
      document.getElementById('password').value
    ); 
    alert('Akun berhasil dibuat! Silakan login'); 
    window.location = 'login.html'; 
  }catch(err){ 
    alert(err.message) 
  } 
}
</script></body></html>
